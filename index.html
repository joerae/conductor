<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conductor — Eine Kleine Nachtmusik</title>
    <meta name="description" content="An interactive orchestral experience where you control tempo in real time. Tap Space to conduct." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  </head>
  <body>

    <!-- Loading screen -->
    <div id="loading-screen">
      <div class="loading-inner">
        <div class="loading-spinner"></div>
        <p>Preparing the orchestra…</p>
      </div>
    </div>

    <!-- Stage (hidden until loaded) -->
    <div id="stage" style="display:none" data-state="ready">

      <!-- Beat flash overlay -->
      <div id="beat-flash"></div>

      <!-- Orchestra silhouette with instrument sections -->
      <div id="orchestra-silhouette" aria-hidden="true">
        <svg viewBox="0 0 840 230" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
          <defs>
            <filter id="glow-gold" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
            <radialGradient id="egg-glow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ffd56b" stop-opacity="1" />
              <stop offset="60%" stop-color="#c9a84c" stop-opacity="0.8" />
              <stop offset="100%" stop-color="#2a2e3a" stop-opacity="0.2" />
            </radialGradient>
          </defs>

          <!-- Section 1: Violin I (Left) -->
          <g id="section-0" class="instrument-section" data-track="0" data-track-name="Violin I">
            <ellipse cx="110" cy="155" rx="18" ry="28" class="musician violin1 egg-0" />
            <ellipse cx="155" cy="148" rx="18" ry="28" class="musician violin1 egg-1" />
            <ellipse cx="200" cy="155" rx="18" ry="28" class="musician violin1 egg-2" />
            <text x="155" y="198" text-anchor="middle" class="section-label">Violin I</text>
          </g>

          <!-- Section 2: Violin II (Center-Left) -->
          <g id="section-1" class="instrument-section" data-track="1" data-track-name="Violin II">
            <ellipse cx="270" cy="148" rx="18" ry="28" class="musician violin2 egg-0" />
            <ellipse cx="315" cy="142" rx="18" ry="28" class="musician violin2 egg-1" />
            <ellipse cx="360" cy="148" rx="18" ry="28" class="musician violin2 egg-2" />
            <text x="315" y="198" text-anchor="middle" class="section-label">Violin II</text>
          </g>

          <!-- Conductor podium & Baton (Center) -->
          <g id="conductor-group" class="conductor-group">
            <rect x="395" y="75" width="50" height="8" rx="4" class="podium" />
            <ellipse cx="420" cy="62" rx="16" ry="22" class="conductor" />
            <line id="baton-line" x1="428" y1="54" x2="465" y2="22" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" class="baton" />
          </g>

          <!-- Section 3: Viola (Center-Right) -->
          <g id="section-2" class="instrument-section" data-track="2" data-track-name="Viola">
            <ellipse cx="480" cy="148" rx="18" ry="28" class="musician viola egg-0" />
            <ellipse cx="525" cy="142" rx="18" ry="28" class="musician viola egg-1" />
            <ellipse cx="570" cy="148" rx="18" ry="28" class="musician viola egg-2" />
            <text x="525" y="198" text-anchor="middle" class="section-label">Viola</text>
          </g>

          <!-- Section 4: Violoncello & Bass (Right) -->
          <g id="section-3" class="instrument-section" data-track="3" data-track-name="Violoncello">
            <ellipse cx="640" cy="155" rx="18" ry="28" class="musician cello egg-0" />
            <ellipse cx="685" cy="148" rx="18" ry="28" class="musician cello egg-1" />
            <ellipse cx="730" cy="155" rx="18" ry="28" class="musician cello egg-2" />
            <text x="685" y="198" text-anchor="middle" class="section-label">Cello / Bass</text>
          </g>

          <!-- Stage floor -->
          <rect x="20" y="210" width="800" height="4" rx="2" class="stage-floor" />
        </svg>
      </div>

      <!-- Piece info & Repertoire button -->
      <div id="piece-info">
        <div class="piece-title-row">
          <h1 id="piece-title">Eine Kleine Nachtmusik</h1>
          <button id="repertoire-btn" class="repertoire-pill-btn" aria-label="Open repertoire selector" title="Choose a piece from repertoire">
            🎵 Repertoire
          </button>
        </div>
        <p id="piece-subtitle">W.A. Mozart</p>
      </div>

      <!-- A/B Tempo Mode Switcher -->
      <div id="tempo-mode-selector" class="mode-selector-container">
        <span class="mode-label">A/B Testing:</span>
        <div class="mode-pill-group">
          <button id="mode-btn-a" class="mode-pill active" data-mode="balanced" title="Mode A: Balanced PLL smoothing (inertia over ~3 beats)">
            Mode A: Balanced
          </button>
          <button id="mode-btn-b" class="mode-pill" data-mode="instant" title="Mode B: Super-responsive on a dime (follows last 2 gaps)">
            Mode B: Instant (Dime)
          </button>
        </div>
        <span class="mode-shortcut-hint">Press <strong>T</strong> to toggle</span>
      </div>

      <!-- Dynamics / Volume Control -->
      <div id="volume-indicator-container" class="volume-container" title="Master Dynamics: Scroll mouse wheel or use ↑/↓ arrows to adjust orchestral volume">
        <span class="volume-icon">🔊</span>
        <span class="volume-label">Dynamics:</span>
        <div class="volume-bar-bg" id="volume-slider-track">
          <div id="volume-bar-fill" class="volume-bar-fill" style="width: 85%;"></div>
        </div>
        <span id="volume-percent" class="volume-val">85%</span>
        <span class="volume-scroll-hint">Scroll 🖱️ / ↑↓</span>
      </div>

      <!-- Prompt -->
      <div id="prompt-area">
        <p id="prompt">Tap SPACE twice to set the pulse.</p>
        <div id="space-key-hint" aria-hidden="true">
          <span class="key">SPACE</span>
        </div>
      </div>

      <!-- Stage Action Controls -->
      <div id="stage-actions">
        <button id="restart-btn" style="display:none" aria-label="Restart piece">↺ Restart from Top</button>
        <button id="repertoire-switch-btn" style="display:none" aria-label="Choose another piece">🎵 Switch Piece</button>
      </div>

      <!-- Footer controls -->
      <footer id="stage-footer">
        <button id="version-btn" class="subtle-link" aria-label="Show version information">v0.2.0</button>
        <span class="footer-divider">•</span>
        <span id="debug-hint" class="debug-hint">Press D for debug overlay</span>
      </footer>
    </div>

    <!-- Repertoire Selection Modal -->
    <div id="repertoire-modal" class="modal-overlay" style="display:none" role="dialog" aria-modal="true" aria-labelledby="repertoire-title">
      <div class="modal-card repertoire-card">
        <div class="modal-header">
          <h2 id="repertoire-title">Orchestral Repertoire</h2>
          <button id="close-repertoire-btn" class="close-btn" aria-label="Close modal">✕</button>
        </div>
        <div id="repertoire-list" class="modal-body repertoire-grid">
          <!-- Populated from REPERTOIRE catalog -->
        </div>
      </div>
    </div>

    <!-- Version & Updates Modal -->
    <div id="version-modal" class="modal-overlay" style="display:none" role="dialog" aria-modal="true" aria-labelledby="version-title">
      <div class="modal-card">
        <div class="modal-header">
          <h2 id="version-title">Conductor Version History</h2>
          <button id="close-modal-btn" class="close-btn" aria-label="Close modal">✕</button>
        </div>
        <div id="modal-content" class="modal-body">
          <!-- Populated from version.json -->
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
