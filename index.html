<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conductor — Eine Kleine Nachtmusik</title>
    <meta name="description" content="An interactive orchestral experience where you control tempo in real time. Tap Space to conduct." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>

    <!-- Loading screen -->
    <div id="loading-screen">
      <div class="loading-inner">
        <div class="loading-spinner"></div>
        <p>Preparing the orchestra…</p>
      </div>
    </div>

    <!-- Stage (hidden until loaded) -->
    <div id="stage" style="display:none" data-state="ready">

      <!-- Beat flash overlay -->
      <div id="beat-flash"></div>

      <!-- Stage Center Area: Orchestra Silhouette + Vertical Dynamic Ladder -->
      <div class="stage-performance-area">
        <!-- Orchestra silhouette with instrument sections -->
        <div id="orchestra-silhouette" aria-hidden="true">
          <svg viewBox="0 0 840 230" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
            <defs>
              <filter id="glow-gold" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
              <radialGradient id="egg-glow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ffd56b" stop-opacity="1" />
                <stop offset="60%" stop-color="#c9a84c" stop-opacity="0.8" />
                <stop offset="100%" stop-color="#2a2e3a" stop-opacity="0.2" />
              </radialGradient>
            </defs>

            <!-- Section 1: Violin I (Left) -->
            <g id="section-0" class="instrument-section" data-track="0" data-track-name="Violin I">
              <g class="section-debug-hud">
                <rect x="75" y="32" width="160" height="52" rx="6" class="debug-vel-pill" />
                <text x="155" y="49" text-anchor="middle" class="debug-vel-main">v: —</text>
                <text x="155" y="63" text-anchor="middle" class="debug-vel-decomp">Raw — ➔ Macro —</text>
                <text x="155" y="75" text-anchor="middle" class="debug-vel-history">History: —</text>
              </g>
              <ellipse cx="108" cy="155" rx="22" ry="32" class="musician violin1 egg-0" />
              <ellipse cx="155" cy="146" rx="25" ry="36" class="musician violin1 egg-1" />
              <ellipse cx="202" cy="155" rx="22" ry="32" class="musician violin1 egg-2" />
              <text x="155" y="202" text-anchor="middle" class="section-label">Violin I</text>
            </g>

            <!-- Section 2: Violin II (Center-Left) -->
            <g id="section-1" class="instrument-section" data-track="1" data-track-name="Violin II">
              <g class="section-debug-hud">
                <rect x="235" y="32" width="160" height="52" rx="6" class="debug-vel-pill" />
                <text x="315" y="49" text-anchor="middle" class="debug-vel-main">v: —</text>
                <text x="315" y="63" text-anchor="middle" class="debug-vel-decomp">Raw — ➔ Macro —</text>
                <text x="315" y="75" text-anchor="middle" class="debug-vel-history">History: —</text>
              </g>
              <ellipse cx="268" cy="148" rx="22" ry="32" class="musician violin2 egg-0" />
              <ellipse cx="315" cy="140" rx="25" ry="36" class="musician violin2 egg-1" />
              <ellipse cx="362" cy="148" rx="22" ry="32" class="musician violin2 egg-2" />
              <text x="315" y="202" text-anchor="middle" class="section-label">Violin II</text>
            </g>

            <!-- Conductor podium & Baton (Center) -->
            <g id="conductor-group" class="conductor-group">
              <rect x="410" y="65" width="60" height="10" rx="5" class="podium" />
              <ellipse cx="440" cy="50" rx="19" ry="24" class="conductor" />
              <line id="baton-line" x1="450" y1="42" x2="495" y2="10" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="baton" />
            </g>

            <!-- Section 3: Viola (Center-Right) -->
            <g id="section-2" class="instrument-section" data-track="2" data-track-name="Viola">
              <g class="section-debug-hud">
                <rect x="445" y="32" width="160" height="52" rx="6" class="debug-vel-pill" />
                <text x="525" y="49" text-anchor="middle" class="debug-vel-main">v: —</text>
                <text x="525" y="63" text-anchor="middle" class="debug-vel-decomp">Raw — ➔ Macro —</text>
                <text x="525" y="75" text-anchor="middle" class="debug-vel-history">History: —</text>
              </g>
              <ellipse cx="478" cy="148" rx="22" ry="32" class="musician viola egg-0" />
              <ellipse cx="525" cy="140" rx="25" ry="36" class="musician viola egg-1" />
              <ellipse cx="572" cy="148" rx="22" ry="32" class="musician viola egg-2" />
              <text x="525" y="202" text-anchor="middle" class="section-label">Viola</text>
            </g>

            <!-- Section 4: Violoncello & Bass (Right) -->
            <g id="section-3" class="instrument-section" data-track="3" data-track-name="Violoncello">
              <g class="section-debug-hud">
                <rect x="605" y="32" width="160" height="52" rx="6" class="debug-vel-pill" />
                <text x="685" y="49" text-anchor="middle" class="debug-vel-main">v: —</text>
                <text x="685" y="63" text-anchor="middle" class="debug-vel-decomp">Raw — ➔ Macro —</text>
                <text x="685" y="75" text-anchor="middle" class="debug-vel-history">History: —</text>
              </g>
              <ellipse cx="638" cy="155" rx="22" ry="32" class="musician cello egg-0" />
              <ellipse cx="685" cy="146" rx="25" ry="36" class="musician cello egg-1" />
              <ellipse cx="732" cy="155" rx="22" ry="32" class="musician cello egg-2" />
              <text x="685" y="202" text-anchor="middle" class="section-label">Cello / Bass</text>
            </g>

            <!-- Stage floor -->
            <rect x="20" y="210" width="800" height="4" rx="2" class="stage-floor" />
          </svg>
        </div>

        <!-- Vertical Orchestral Dynamic Ladder -->
        <aside id="dynamic-ladder-container" class="dynamic-ladder-container" title="Orchestral Dynamics: Use ↑/↓ arrows, mouse wheel, or click to shape dynamic expression">
          <div class="dynamic-ladder-header">
            <span class="dynamic-icon">𝄢</span>
            <span class="dynamic-title">Dynamics</span>
          </div>
          <div class="dynamic-ladder" id="dynamic-ladder" role="group" aria-label="Orchestral dynamic levels">
            <button class="dynamic-step" data-dynamic="fff" title="Fortississimo (Overburn ⚡)">
              <span class="dynamic-symbol">fff</span>
              <span class="dynamic-sparkle">⚡</span>
              <span class="accent-badge-icon">&gt;</span>
            </button>
            <button class="dynamic-step" data-dynamic="ff" title="Fortissimo (Very Loud)">
              <span class="dynamic-symbol">ff</span>
              <span class="accent-badge-icon">&gt;</span>
            </button>
            <button class="dynamic-step" data-dynamic="f" title="Forte (Loud)">
              <span class="dynamic-symbol">f</span>
              <span class="accent-badge-icon">&gt;</span>
            </button>
            <button class="dynamic-step active" data-dynamic="mf" title="Mezzo-forte (Default)">
              <span class="dynamic-symbol">mf</span>
              <span class="accent-badge-icon">&gt;</span>
            </button>
            <button class="dynamic-step" data-dynamic="mp" title="Mezzo-piano (Moderately soft)">
              <span class="dynamic-symbol">mp</span>
              <span class="accent-badge-icon">&gt;</span>
            </button>
            <button class="dynamic-step" data-dynamic="p" title="Piano (Soft)">
              <span class="dynamic-symbol">p</span>
              <span class="accent-badge-icon">&gt;</span>
            </button>
            <button class="dynamic-step" data-dynamic="pp" title="Pianissimo (Very soft)">
              <span class="dynamic-symbol">pp</span>
              <span class="accent-badge-icon">&gt;</span>
            </button>
          </div>
          <div class="dynamic-ladder-hint">
            <span>↑↓ Dyn • → Accent (&gt;)</span>
          </div>
        </aside>
      </div>

      <!-- Piece info & Repertoire button -->
      <div id="piece-info">
        <div class="piece-title-row">
          <h1 id="piece-title">Eine Kleine Nachtmusik</h1>
          <button id="repertoire-btn" class="repertoire-pill-btn" aria-label="Open repertoire selector" title="Choose a piece from repertoire">
            🎵 Repertoire
          </button>
        </div>
        <p id="piece-subtitle">W.A. Mozart</p>
      </div>

      <!-- Control Bars: Input Source & Tempo Mode Switcher -->
      <div class="control-bars-wrap">
        <div id="input-source-selector" class="mode-selector-container">
          <span class="mode-label">Input:</span>
          <div class="mode-pill-group">
            <button id="input-btn-keyboard" class="mode-pill active" data-input-source="keyboard" title="Keyboard mode: Tap SPACE bar to conduct">
              ⌨️ Space Bar
            </button>
            <button id="input-btn-camera" class="mode-pill" data-input-source="camera" title="Camera mode: Conduct with hand gestures in front of webcam">
              📷 Camera
            </button>
          </div>
          <span class="mode-shortcut-hint">Press <strong>C</strong> to switch</span>
        </div>

        <div id="tempo-mode-selector" class="mode-selector-container">
          <span class="mode-label">Tempo:</span>
          <div class="mode-pill-group">
            <button id="mode-btn-a" class="mode-pill active" data-mode="balanced" title="Mode A: Balanced PLL smoothing (inertia over ~3 beats)">
              Mode A: Balanced
            </button>
            <button id="mode-btn-b" class="mode-pill" data-mode="instant" title="Mode B: Super-responsive on a dime (instant cuts & speedups)">
              Mode B: Instant
            </button>
            <button id="mode-btn-c" class="mode-pill" data-mode="autoplay" title="Mode C: Autoplay (tap twice to set tempo, plays continuously at tempo)">
              Mode C: Autoplay ⚡
            </button>
          </div>
          <span class="mode-shortcut-hint">Press <strong>T</strong> to cycle</span>
        </div>
      </div>

      <!-- Prompt -->
      <div id="prompt-area">
        <p id="prompt">Tap SPACE twice to set the pulse.</p>
        <div id="space-key-hint" aria-hidden="true">
          <span class="key">SPACE</span>
        </div>
      </div>

      <!-- Stage Action Controls -->
      <div id="stage-actions">
        <button id="restart-btn" style="display:none" aria-label="Restart piece">↺ Restart from Top</button>
        <button id="repertoire-switch-btn" style="display:none" aria-label="Choose another piece">🎵 Switch Piece</button>
      </div>

      <!-- Footer controls -->
      <footer id="stage-footer">
        <button id="version-btn" class="subtle-link" aria-label="Show version information">v0.4.0</button>
        <span class="footer-divider">•</span>
        <span id="debug-hint" class="debug-hint">Press D for debug overlay & A/B DSP</span>
      </footer>
    </div>

    <!-- Repertoire Selection Modal -->
    <div id="repertoire-modal" class="modal-overlay" style="display:none" role="dialog" aria-modal="true" aria-labelledby="repertoire-title">
      <div class="modal-card repertoire-card">
        <div class="modal-header">
          <h2 id="repertoire-title">Orchestral Repertoire</h2>
          <button id="close-repertoire-btn" class="close-btn" aria-label="Close modal">✕</button>
        </div>
        <div id="repertoire-list" class="modal-body repertoire-grid">
          <!-- Populated from REPERTOIRE catalog -->
        </div>
      </div>
    </div>

    <!-- Version & Updates Modal -->
    <div id="version-modal" class="modal-overlay" style="display:none" role="dialog" aria-modal="true" aria-labelledby="version-title">
      <div class="modal-card">
        <div class="modal-header">
          <h2 id="version-title">Conductor Version History</h2>
          <button id="close-modal-btn" class="close-btn" aria-label="Close modal">✕</button>
        </div>
        <div id="modal-content" class="modal-body">
          <!-- Populated from version.json -->
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
